<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5 text-center">

          <!-- Icon -->
          <div class="mb-3">
            <div class="icon-box mx-auto rounded-4 d-flex
                        align-items-center justify-content-center">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
          </div>

          <!-- Heading -->
          <h2 class="fw-bold mb-2">Password Generator</h2>
          <p class="text-secondary mb-4">
            Generate a strong password to keep your accounts safe.
          </p>

          <!-- Password display -->
       <div class="password-box rounded-3 p-3 mb-4">
  <div class="position-relative mb-2">
    <small class="text-secondary fw-semibold">
      YOUR PASSWORD
    </small>

    <i class="bi bi-lock-fill text-primary position-absolute end-0"></i>
  </div>

  <p class="password-text mb-0 text-break">
    {{ password() || 'Click generate to begin' }}
  </p>
</div>

          <!-- Generate button -->
          <button
            class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold"
            (click)="Generate()">
            <i class="bi bi-arrow-repeat me-2"></i>
            Generate Password
          </button>

          <p class="text-secondary small mt-4 mb-0">
            <i class="bi bi-shield-check me-1"></i>
            Your security starts with a strong password.
          </p>

        </div>
      </div>

    </div>
  </div>
</div>
