<div class="text-center mt-10">
    <h1 class="text-4xl font-bold">  {{time()}}s  </h1>


    <div class="mt-4 flex justify-center gap-3">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4" (click)="start()">
            Start
        </button>
        <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4" (click)="stop()" >
            Stop
        </button>
        <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4" (click)="reset()">
            Reset
        </button>
    </div>
</div>
