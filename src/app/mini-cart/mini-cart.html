<div class="container py-5">

    <!-- Cart Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Shopping Cart</h1>
        <span class="badge bg-primary rounded-pill fs-6">
            Cart: {{count()}}
        </span>
    </div>

    <div class="row g-4">

        <!-- Products Section -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h2 class="h5 mb-0">Products</h2>
                </div>

                <div class="card-body">
                    @for(p of products; track p) {
                    <div class="d-flex justify-content-between align-items-center border-bottom py-3">

                        <div>
                            <h3 class="h6 mb-1">{{p.name}}</h3>
                            <p class="text-muted mb-0">
                                ${{p.price}}
                            </p>
                        </div>

                        <button class="btn btn-primary btn-sm" (click)="addToCart(p)">
                            <i class="bi bi-cart-plus me-1"></i>
                            Add to Cart
                        </button>

                    </div>
                    }
                </div>
            </div>
        </div>

        <!-- Cart Section -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">

                <div class="card-header bg-white py-3">
                    <h2 class="h5 mb-0">Your Cart</h2>
                </div>

                <div class="card-body">

                    @for(c of cart(); track c; let i = $index) {
                    <div class="d-flex justify-content-between align-items-center border-bottom py-3">

                        <span class="fw-medium">
                            {{c.name}}
                        </span>

                        <button class="btn btn-outline-danger btn-sm" (click)="removeFromCart(i)">
                            <i class="bi bi-trash me-1"></i>
                            Remove
                        </button>

                    </div>
                    }

                    @if(cart().length === 0) {
                    <div class="text-center text-muted py-4">
                        <p class="mb-0">Your cart is currently empty.</p>
                    </div>
                    }

                </div>

                <!-- Cart Total -->
                <div class="card-footer bg-light p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Total</span>
                        <span class="fs-4 fw-bold text-primary">
                            ${{total()}}
                        </span>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
