<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-2xl shadow">

    <h2 class="text-xl font-bold mb-4">
        Question {{currentIndex() + 1}}
    </h2>

    <p class="mb-4">
        {{currentQuestion().question}}
    </p>

    <div class="flex flex-col gap-2">

        @for(option of currentQuestion().options; track option){
            <button class="border p-2 rounded hover:bg-gray-100" (click)="answer(option)">
                {{option}}
            </button>
        }

        @if(finished()){
            <div class="mt-6 text-center">
                <h2 class="text-lg font-bold">Score : {{score()}} / {{questions.length}}</h2>
            </div>
        }

        <button class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" (click)="restart()">
            Restart Quiz
        </button>
    </div>
</div>
